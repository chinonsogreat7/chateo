services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chateo
      POSTGRES_PASSWORD: chateo
      POSTGRES_USER: chateo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chateo -d chateo"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - chateo-postgres:/var/lib/postgresql/data

volumes:
  chateo-postgres:
